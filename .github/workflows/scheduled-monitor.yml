name: ETH Scheduled Monitor

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: eth-scheduled-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      ETH_VALUATION_API_URL: ${{ secrets.ETH_VALUATION_API_URL }}
      ETH_VALUATION_API_TOKEN: ${{ secrets.ETH_VALUATION_API_TOKEN }}
      ETH_FLOW_API_URL: ${{ secrets.ETH_FLOW_API_URL }}
      ETH_FLOW_API_TOKEN: ${{ secrets.ETH_FLOW_API_TOKEN }}
      ETH_STRUCTURAL_API_URL: ${{ secrets.ETH_STRUCTURAL_API_URL }}
      ETH_STRUCTURAL_API_TOKEN: ${{ secrets.ETH_STRUCTURAL_API_TOKEN }}
      BINANCE_EGRESS_SSH_KEY: ${{ secrets.BINANCE_EGRESS_SSH_KEY }}
      ETH_FILTER_1H_BY_4H: "1"
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Restore latest successful monitor state
        continue-on-error: true
        run: python -m scripts.restore_monitor_state --output-dir .state
      - name: Check PostgreSQL availability
        id: db
        run: python -m scripts.database_preflight --github-output "${GITHUB_OUTPUT}"
      - name: Degrade persistence when PostgreSQL is unavailable
        if: steps.db.outputs.available != 'true'
        shell: bash
        run: |
          printf '%s=\n' 'DATABASE_URL' >> "${GITHUB_ENV}"
          echo "ETH_PERSISTENCE_DEGRADED=1" >> "${GITHUB_ENV}"
      - name: Notify degraded persistence
        if: steps.db.outputs.available != 'true'
        continue-on-error: true
        run: >-
          python -m scripts.send_system_health
          --component "PostgreSQL persistence"
          --status DEGRADED
          --reason "${{ steps.db.outputs.reason }}"
          --impact "Durable PIT/state persistence is unavailable; 4H/1H continue from GitHub artifact fallback."
      - name: Validate required secrets
        shell: bash
        run: |
          if [[ -z "$TG_BOT_TOKEN" || -z "$TG_CHAT_ID" ]]; then
            echo "ERROR: TG_BOT_TOKEN and TG_CHAT_ID are required."
            exit 1
          fi
          if [[ -z "$DATABASE_URL" ]]; then
            echo "WARNING: DATABASE_URL not configured. PIT persistence will be ARTIFACT_ONLY and production approval cannot be durable across runs."
          else
            echo "OK: external PostgreSQL persistence configured."
          fi
          if [[ -z "$DUNE_API_KEY" ]]; then
            echo "WARNING: DUNE_API_KEY not configured. ETH-native Capital Flow/Structural state will depend on explicit ETH_* adapters or remain unavailable."
          else
            echo "OK: native Dune collector configured."
          fi
      - name: Start Binance BKK egress
        continue-on-error: true
        shell: bash
        run: |
          if [[ -z "$BINANCE_EGRESS_SSH_KEY" ]]; then
            echo "WARNING: BINANCE_EGRESS_SSH_KEY not configured; Binance will use direct runner egress and may fall back to Deribit."
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BINANCE_EGRESS_SSH_KEY" > "$HOME/.ssh/binance_egress"
          chmod 600 "$HOME/.ssh/binance_egress"
          cp config/binance_egress_known_hosts "$HOME/.ssh/binance_egress_known_hosts"
          ssh -fNT \
            -D 127.0.0.1:19080 \
            -i "$HOME/.ssh/binance_egress" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/binance_egress_known_hosts" \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            root@43.133.101.242
          python - <<'PY'
          import requests

          proxy = "socks5h://127.0.0.1:19080"
          proxies = {"http": proxy, "https": proxy}
          for url in (
              "https://api.binance.com/api/v3/ping",
              "https://fapi.binance.com/fapi/v1/ping",
          ):
              response = requests.get(url, proxies=proxies, timeout=10)
              response.raise_for_status()
              print(f"OK: Binance BKK egress {url} -> HTTP {response.status_code}")
          PY
          echo "BINANCE_PROXY_URL=socks5h://127.0.0.1:19080" >> "$GITHUB_ENV"
      - name: Apply versioned migrations
        if: steps.db.outputs.available == 'true'
        run: python -m scripts.apply_migrations
      - name: Restore non-authoritative convenience cache
        uses: actions/cache@v4
        with:
          path: |
            eth_reports/cache
            eth_reports/v3_history.csv
          key: eth-monitor-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            eth-monitor-cache-${{ runner.os }}-
      - name: Run monitor
        run: python -m scripts.run_monitor
      - name: Validate production run contract
        run: python -m scripts.validate_production_run
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-monitor-${{ github.run_number }}-${{ github.sha }}
          path: eth_reports/
          if-no-files-found: error
          retention-days: 30
