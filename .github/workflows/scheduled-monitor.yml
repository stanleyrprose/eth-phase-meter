name: ETH Scheduled Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */4 * * *"

permissions:
  contents: read

concurrency:
  group: eth-scheduled-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ETH_FILTER_1H_BY_4H: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test gate
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate Telegram secrets
        shell: bash
        run: |
          if [[ -z "$TG_BOT_TOKEN" || -z "$TG_CHAT_ID" ]]; then
            echo "ERROR: TG_BOT_TOKEN and TG_CHAT_ID are required."
            exit 1
          fi
      - name: Report persistence mode
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "WARNING: DATABASE_URL not configured. PIT persistence will be ARTIFACT_ONLY and unsuitable as long-term calibration source of truth."
          else
            echo "OK: external PostgreSQL persistence configured."
          fi
      - name: Restore non-authoritative convenience cache
        uses: actions/cache@v4
        with:
          path: |
            eth_reports/cache
            eth_reports/v3_history.csv
          key: eth-monitor-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            eth-monitor-cache-${{ runner.os }}-
      - name: Run monitor
        run: python scripts/run_monitor.py
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-monitor-${{ github.run_number }}-${{ github.sha }}
          path: eth_reports/
          if-no-files-found: error
          retention-days: 30
