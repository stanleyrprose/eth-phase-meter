name: Forecast Shadow Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '35 */4 * * *'

permissions:
  contents: read

concurrency:
  group: eth-shadow-cycle
  cancel-in-progress: false

jobs:
  shadow-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Check PostgreSQL availability
        id: db
        run: python -m scripts.database_preflight --github-output "${GITHUB_OUTPUT}" --report eth_reports/governance/database_health.json
      - name: Enter fail-closed shadow mode when PostgreSQL is unavailable
        if: steps.db.outputs.available != 'true'
        shell: bash
        run: |
          printf '%s=\n' 'DATABASE_URL' >> "${GITHUB_ENV}"
          echo "ETH_PERSISTENCE_DEGRADED=1" >> "${GITHUB_ENV}"
          echo "Shadow cycle skipped safely: durable PostgreSQL unavailable (${{ steps.db.outputs.reason }})." >> "${GITHUB_STEP_SUMMARY}"
      - name: Apply versioned migrations
        run: python -m scripts.apply_migrations
      - name: Run shadow creation and settlement
        run: python -m scripts.run_shadow_cycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-shadow-cycle-${{ github.run_number }}-${{ github.sha }}
          path: |
            eth_reports/shadow/
            eth_reports/governance/migration_report.json
            eth_reports/governance/database_health.json
          if-no-files-found: error
          retention-days: 90
