name: Feature Ablation Research
on:
  workflow_dispatch:
  pull_request:
    paths: ['eth_trend_v3/feature_ablation_research.py','eth_trend_v3/probabilistic_research.py','tests/test_forecast_research_completion.py']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_forecast_research_completion.py
