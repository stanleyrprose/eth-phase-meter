name: Meta Action Outcome Revision Plan
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Setup required BKK PostgreSQL tunnel
        uses: ./.github/actions/setup-bkk-postgres
        with:
          ssh-key: ${{ secrets.BINANCE_EGRESS_SSH_KEY }}
          required: "true"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ci.lock
      - name: Apply additive migrations
        run: python -m scripts.apply_migrations
      - name: Plan append-only outcome revisions
        run: python -m scripts.plan_meta_action_outcome_revisions --source-git-sha "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-action-outcome-revision-plan-${{ github.run_id }}
          path: eth_reports/governance/meta_action_outcome_revision_plan.json
          if-no-files-found: error
          retention-days: 90
