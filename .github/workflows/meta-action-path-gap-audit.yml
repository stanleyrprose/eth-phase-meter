name: Meta Action Path Gap Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Setup required BKK PostgreSQL tunnel
        uses: ./.github/actions/setup-bkk-postgres
        with:
          ssh-key: ${{ secrets.BINANCE_EGRESS_SSH_KEY }}
          required: "true"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ci.lock
      - name: Audit Meta Action PIT gaps
        run: python -m scripts.audit_meta_action_path_gaps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-action-path-gap-audit-${{ github.run_id }}
          path: eth_reports/governance/meta_action_path_gap_audit.json
          if-no-files-found: error
          retention-days: 90
