name: Forecast Governance Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'eth_trend_v3/production_runtime.py'
      - 'eth_trend_v3/promotion.py'
      - 'eth_trend_v3/shadow_forecast.py'
      - 'eth_trend_v3/runner.py'
      - 'tests/test_production_fail_closed.py'
      - 'tests/test_forecast_research_m2_m9.py'
      - '.github/workflows/forecast-governance.yml'

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - name: Validate M8-M9 shadow and production governance
        run: python -m pytest -q tests/test_forecast_research_m2_m9.py tests/test_production_fail_closed.py
      - name: Validate current candidate remains fail closed unless qualified
        run: python -m scripts.validate_model
      - uses: actions/upload-artifact@v4
        with:
          name: forecast-governance-evidence
          path: eth_reports/validation_report.json
