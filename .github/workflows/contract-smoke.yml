name: Forecast Runtime Contract and Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '10 2 * * 1'

permissions:
  contents: read

jobs:
  contract-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup BKK PostgreSQL tunnel
        uses: ./.github/actions/setup-bkk-postgres
        with:
          ssh-key: ${{ secrets.BINANCE_EGRESS_SSH_KEY }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - name: Check PostgreSQL availability
        id: db
        run: python -m scripts.database_preflight --github-output "${GITHUB_OUTPUT}" --report eth_reports/governance/database_health.json
      - name: Degrade external persistence contract when PostgreSQL is unavailable
        if: steps.db.outputs.available != 'true'
        shell: bash
        run: |
          printf '%s=\n' 'DATABASE_URL' >> "${GITHUB_ENV}"
          echo "ETH_PERSISTENCE_DEGRADED=1" >> "${GITHUB_ENV}"
          echo "PostgreSQL external contract degraded: ${{ steps.db.outputs.reason }}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Apply versioned migrations
        run: python -m scripts.apply_migrations
      - name: Read-only provider and persistence contracts
        run: python -m scripts.validate_runtime_contracts
      - name: Collect-transform-infer-persist-validate smoke without Telegram
        run: python -m scripts.run_contract_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-contract-smoke-${{ github.run_number }}-${{ github.sha }}
          path: |
            eth_reports/contracts/
            eth_reports/governance/migration_report.json
            eth_reports/governance/database_health.json
          if-no-files-found: error
          retention-days: 90
