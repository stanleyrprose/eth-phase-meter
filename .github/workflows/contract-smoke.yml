name: Forecast Runtime Contract and Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '10 2 * * 1'

permissions:
  contents: read

jobs:
  contract-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - name: Apply versioned migrations
        run: python -m scripts.apply_migrations
      - name: Read-only provider and persistence contracts
        run: python -m scripts.validate_runtime_contracts
      - name: Collect-transform-infer-persist-validate smoke without Telegram
        run: python -m scripts.run_contract_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-contract-smoke-${{ github.run_number }}-${{ github.sha }}
          path: |
            eth_reports/contracts/
            eth_reports/governance/migration_report.json
          if-no-files-found: error
          retention-days: 90
