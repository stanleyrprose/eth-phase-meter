name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**", "feat/**", "fix/**", "research/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.lock
      - name: Compile check
        run: python -m compileall -q .
      - name: Full test suite
        run: python -m pytest -q
      - name: Backtest smoke test
        run: python -m scripts.run_backtest
      - name: Model validation smoke test
        run: python -m scripts.validate_model
      - name: Secret pattern sanity check
        run: |
          if grep -RInE '(TG_BOT_TOKEN|DATABASE_URL|ETHERSCAN_API_KEY)=[^$<{[:space:]]+' \
            --exclude='*.md' --exclude='env.example' --exclude='.env.example' \
            --exclude-dir='.git' --exclude-dir='__pycache__' --exclude-dir='.pytest_cache' .; then
            echo 'Potential hard-coded secret detected.'
            exit 1
          fi
