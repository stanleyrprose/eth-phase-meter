name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**", "fix/**", "research/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q .
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Secret pattern sanity check
        run: |
          if grep -RInE '(TG_BOT_TOKEN|DATABASE_URL|ETHERSCAN_API_KEY)=[^$<{[:space:]]+' --exclude='*.md' --exclude='env.example' --exclude='.env.example' .; then
            echo 'Potential hard-coded secret detected.'
            exit 1
          fi
