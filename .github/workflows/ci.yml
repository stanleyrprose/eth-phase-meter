name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**", "feat/**", "fix/**", "research/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile check
        run: python -m compileall -q eth_trend_v3 scripts *.py
      - name: Complete unit and regression suite
        run: python -m pytest -q
      - name: Backtest smoke test
        run: python -m scripts.run_backtest
      - name: Model validation smoke test
        run: python -m scripts.validate_model
      - name: Secret pattern sanity check
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git grep -nE '(TG_BOT_TOKEN|DATABASE_URL|ETHERSCAN_API_KEY)=[^$<{[:space:]]+' -- ':!*.md' ':!env.example' ':!.env.example' || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo 'Potential hard-coded secret detected.'
            exit 1
          fi
