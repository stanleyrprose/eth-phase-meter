name: HMM Forecast Ablation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-ci.lock
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: HMM forecast ablation
        run: python -m scripts.run_hmm_ablation
      - name: Upload HMM ablation report
        uses: actions/upload-artifact@v4
        with:
          name: hmm-forecast-ablation-report
          path: eth_reports/hmm_ablation
          if-no-files-found: error
          retention-days: 30
