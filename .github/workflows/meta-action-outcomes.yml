name: ETH Meta Action Outcomes

on:
  workflow_dispatch:
    inputs:
      event_b64:
        description: Base64-encoded non-secret Meta Action event
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eth-meta-action-outcomes
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      BINANCE_EGRESS_SSH_KEY: ${{ secrets.BINANCE_EGRESS_SSH_KEY }}

    steps:
      - uses: actions/checkout@v5
      - name: Setup BKK PostgreSQL tunnel
        continue-on-error: true
        uses: ./.github/actions/setup-bkk-postgres
        with:
          ssh-key: ${{ secrets.BINANCE_EGRESS_SSH_KEY }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Check PostgreSQL availability
        id: db
        run: python -m scripts.database_preflight --github-output "${GITHUB_OUTPUT}" --report eth_reports/meta-action-outcomes/database_health.json
      - name: Degrade research persistence when PostgreSQL is unavailable
        if: steps.db.outputs.available != 'true'
        shell: bash
        run: |
          printf '%s=\n' 'DATABASE_URL' >> "${GITHUB_ENV}"
      - name: Apply versioned migrations
        if: steps.db.outputs.available == 'true'
        run: python -m scripts.apply_migrations
      - name: Persist Meta Action and settle outcomes
        env:
          META_ACTION_EVENT_B64: ${{ inputs.event_b64 }}
        run: >-
          python -m scripts.run_meta_action_outcomes
          --event-b64 "${META_ACTION_EVENT_B64}"
      - name: Upload Meta Action research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-meta-action-outcomes-${{ github.run_number }}
          path: eth_reports/meta-action-outcomes/
          if-no-files-found: error
          retention-days: 30
