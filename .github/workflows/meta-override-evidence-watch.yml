name: Meta Override Evidence Watch
on:
  schedule:
    - cron: "35 */4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meta-override-evidence-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup required BKK PostgreSQL tunnel
        uses: ./.github/actions/setup-bkk-postgres
        with:
          ssh-key: ${{ secrets.BINANCE_EGRESS_SSH_KEY }}
          required: "true"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ci.lock
      - run: python -m scripts.apply_migrations
      - name: Check evidence checkpoint
        run: python -m scripts.meta_override_evidence_watch
