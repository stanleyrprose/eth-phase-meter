name: Forecast PRD v2.3 Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'eth_trend_v3/**'
      - 'scripts/**'
      - 'tests/test_prd_v23_*.py'
      - 'tests/test_research_feature_depth.py'
      - 'migrations/**'
      - 'requirements*.lock'
      - 'docs/FORECAST_RESEARCH_*'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'eth_trend_v3/**'
      - 'scripts/**'
      - 'migrations/**'
      - 'requirements*.lock'
      - 'docs/FORECAST_RESEARCH_*'

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-ci.lock
      - name: Minimal PRD v2.3 affected tests
        run: >-
          python -m pytest -q
          tests/test_prd_v23_governance.py
          tests/test_prd_v23_acceptance.py
          tests/test_research_feature_depth.py
          tests/test_research_foundation.py
          tests/test_forecast_research_m2_m9.py
          tests/test_forecast_research_completion.py
          tests/test_forecast_production_closure.py
      - name: Generate M1-M9 deterministic implementation evidence
        run: python -m scripts.validate_forecast_research_plan
      - name: Apply versioned migrations
        run: python -m scripts.apply_migrations
      - name: Runtime provider and PostgreSQL contracts
        run: python -m scripts.validate_runtime_contracts
      - name: Real no-Telegram smoke
        run: python -m scripts.run_contract_smoke
      - name: Final 30-item PRD acceptance
        run: python -m scripts.validate_prd_v23_acceptance --ci-pass --contract-smoke-pass
      - name: Write system observability snapshot
        run: python -m scripts.write_system_status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-prd-v23-acceptance-${{ github.run_number }}-${{ github.sha }}
          path: |
            eth_reports/forecast-research/
            eth_reports/contracts/
            eth_reports/governance/migration_report.json
          if-no-files-found: error
          retention-days: 90
